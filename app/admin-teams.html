<!DOCTYPE html>
<html lang="en" x-data="adminTeams">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Admin</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/fonts.css">
  <script src="/admin.js"></script>
  <script defer src="/alpinejs.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-[#1a1a2e] text-white px-5 py-3.5 flex items-center justify-between gap-4">
    <h1 class="text-lg font-bold tracking-tight shrink-0">Team Admin</h1>

    <!-- Organization / Exhibition picker (Phase 1d) — plain text when
         there's only one choice, clickable to open the search+select popup
         when there's more than one. -->
    <div class="flex items-center gap-4 flex-1 min-w-0">
      <div class="min-w-0">
        <div class="text-[10px] uppercase tracking-wide text-white/40 leading-none mb-0.5">Organization</div>
        <button type="button" @click="openPicker('organization')"
                :class="organizationsTotal > 1 ? 'hover:text-white cursor-pointer' : 'cursor-default'"
                class="text-sm text-white/80 truncate max-w-[10rem] block text-left">
          <span x-text="selectedOrganizationName || '—'"></span>
        </button>
      </div>
      <div class="min-w-0">
        <div class="text-[10px] uppercase tracking-wide text-white/40 leading-none mb-0.5">Exhibition</div>
        <button type="button" @click="openPicker('exhibition')"
                :class="exhibitionsTotal > 1 ? 'hover:text-white cursor-pointer' : 'cursor-default'"
                class="text-sm text-white/80 truncate max-w-[10rem] block text-left">
          <span x-text="selectedExhibitionName || '—'"></span>
        </button>
      </div>
    </div>

    <div class="flex items-center gap-5 shrink-0">
      <span class="text-xs text-white/60" x-text="total + ' teams'"></span>
      <a href="/" class="text-xs text-white/60 hover:text-white transition">← Back to app</a>
    </div>
  </header>

  <!-- Organization/Exhibition picker popup (Phase 1d) -->
  <div x-show="picker.open" class="fixed inset-0 z-50 bg-black/50 flex items-start justify-center pt-24" @click.self="closePicker()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-[#1a1a2e]" x-text="picker.kind === 'organization' ? 'Select organization' : 'Select exhibition'"></h2>
        <button type="button" @click="closePicker()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
      </div>
      <input type="text" x-model="picker.search" @input.debounce.300ms="searchPicker()"
             placeholder="Search…"
             class="w-full text-sm border border-gray-200 rounded-lg px-3 py-1.5 mb-3 focus:outline-none focus:ring-2 focus:ring-accent/40">
      <select :size="Math.min(8, Math.max(3, picker.items.length))"
              @change="choosePickerItemByValue($event.target.value)"
              class="w-full text-sm border border-gray-200 rounded-lg">
        <template x-for="item in picker.items" :key="item.organizationid || item.exhibitionid">
          <option :value="item.organizationid || item.exhibitionid" x-text="item.name"></option>
        </template>
      </select>
      <div class="flex items-center justify-between mt-2">
        <span class="text-xs text-gray-400" x-text="picker.items.length + ' of ' + picker.total"></span>
        <button type="button" x-show="picker.items.length < picker.total" @click="loadMorePicker()"
                :disabled="picker.loading"
                class="text-xs text-accent hover:underline disabled:opacity-50">
          <span x-text="picker.loading ? 'Loading…' : 'Load more'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Admin page nav -->
  <nav class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center gap-1 text-sm overflow-x-auto">
    <a href="/admin-master.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Overview</a>
    <a href="/admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Photos</a>
    <a href="/admin-users.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Users</a>
    <a href="/admin-teams.html" class="px-3 py-1.5 rounded-lg font-semibold bg-gray-100 whitespace-nowrap">Teams</a>
    <a href="/admin-emojis.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Emojis</a>
    <a href="/admin-labels.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Labels</a>
    <a href="/admin-permissions.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Permissions</a>
    <a href="/admin-roles.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Roles</a>
    <a href="/gallery-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Galleries</a>
    <a href="/template-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Templates</a>
  </nav>

  <!-- Auth error / no exhibitions -->
  <div x-show="authError"
       class="max-w-md mx-auto mt-12 bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-800 text-sm">
    You don't have admin access, or the server needs to be rebuilt with the latest code.
  </div>
  <div x-show="noExhibitions"
       class="max-w-md mx-auto mt-12 bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-800 text-sm">
    You are not a member of any exhibitions.
  </div>

  <div x-show="!authError && !noExhibitions" class="max-w-4xl mx-auto p-4">

    <!-- Add team -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 mb-4">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Add team</p>
      <div class="flex items-center gap-2 flex-wrap">
        <input type="text" x-model="newTeamName" placeholder="Team name"
               class="flex-1 min-w-[10rem] px-3 py-1.5 text-sm border border-gray-300 rounded-lg
                      focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
        <input type="text" x-model="newTeamDescription" placeholder="Description (optional)"
               class="flex-1 min-w-[10rem] px-3 py-1.5 text-sm border border-gray-300 rounded-lg
                      focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
        <button type="button" @click="createTeam()" :disabled="creating"
                class="px-4 py-1.5 text-sm font-semibold rounded-lg bg-[#1a1a2e] text-white hover:bg-accent transition
                       disabled:opacity-50 disabled:cursor-default">Add</button>
      </div>
    </div>

    <!-- Search -->
    <div class="flex items-center gap-2 mb-4">
      <input type="search" x-model="search" placeholder="Search teams…"
             @keyup.enter="doSearch()"
             class="flex-1 max-w-sm px-3 py-1.5 text-sm border border-gray-300 rounded-full bg-white
                    focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
      <button type="button" @click="doSearch()"
              class="px-3 py-1.5 text-sm rounded-full bg-gray-200 hover:bg-accent hover:text-white transition">Search</button>
    </div>

    <!-- Loading skeleton -->
    <div x-show="loading" class="space-y-2">
      <template x-for="n in [1,2,3]" :key="n">
        <div class="h-16 bg-white rounded-xl border border-gray-200 animate-pulse"></div>
      </template>
    </div>

    <!-- Team list -->
    <div x-show="!loading" class="space-y-3">
      <template x-for="t in teams" :key="t.teamid">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">

          <!-- Row (view mode) -->
          <div x-show="!t.editing" class="p-4 flex items-center gap-3">
            <button type="button" @click="toggleExpand(t)"
                    class="shrink-0 w-6 h-6 flex items-center justify-center rounded-lg hover:bg-gray-100 transition"
                    title="Show members">
              <svg class="w-4 h-4 text-gray-400 transition-transform"
                   :class="expandedTeamId === t.teamid ? 'rotate-90' : ''"
                   fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-gray-800 truncate" x-text="t.name"></p>
              <p class="text-xs text-gray-500 truncate" x-text="t.description || '(no description)'"></p>
            </div>
            <span class="text-xs text-gray-400 shrink-0" x-text="t.member_count + ' member' + (t.member_count === 1 ? '' : 's')"></span>
            <button type="button" @click="startEdit(t)"
                    class="shrink-0 text-xs font-semibold text-gray-500 hover:text-accent transition">Edit</button>
            <button type="button" @click="deleteTeam(t)"
                    class="shrink-0 text-xs font-semibold text-red-500 hover:text-red-700 transition">Delete</button>
          </div>

          <!-- Row (edit mode) -->
          <div x-show="t.editing" class="p-4 flex items-center gap-2 flex-wrap">
            <input type="text" x-model="t.editName" placeholder="Team name"
                   class="flex-1 min-w-[8rem] px-3 py-1.5 text-sm border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
            <input type="text" x-model="t.editDescription" placeholder="Description"
                   class="flex-1 min-w-[8rem] px-3 py-1.5 text-sm border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
            <button type="button" @click="saveEdit(t)"
                    class="px-3 py-1.5 text-sm font-semibold rounded-lg bg-[#1a1a2e] text-white hover:bg-accent transition">Save</button>
            <button type="button" @click="cancelEdit(t)"
                    class="px-3 py-1.5 text-sm rounded-lg bg-gray-100 hover:bg-gray-200 transition">Cancel</button>
          </div>

          <!-- Members panel -->
          <div x-show="expandedTeamId === t.teamid" class="border-t border-gray-100 bg-gray-50/60 p-4">
            <div x-show="membersLoading" class="text-xs text-gray-400">Loading members…</div>

            <div x-show="!membersLoading" class="space-y-1.5 mb-3">
              <template x-for="m in members" :key="m.userid">
                <div class="flex items-center gap-2 bg-white rounded-lg border border-gray-100 px-3 py-1.5">
                  <div class="flex-1 min-w-0">
                    <span class="text-sm text-gray-800" x-text="m.username"></span>
                    <span class="text-xs text-gray-400 ml-1" x-text="m.email"></span>
                  </div>
                  <button type="button" @click="removeMember(t.teamid, m)"
                          class="text-xs font-semibold text-red-500 hover:text-red-700 transition shrink-0">Remove</button>
                </div>
              </template>
              <div x-show="members.length === 0" class="text-xs text-gray-400 py-1">No members yet.</div>
            </div>

            <!-- Add member -->
            <div class="flex items-center gap-2 mb-2">
              <input type="search" x-model="memberSearch" placeholder="Search users to add…"
                     @keyup.enter="searchMemberCandidates()"
                     class="flex-1 max-w-xs px-3 py-1.5 text-sm border border-gray-300 rounded-full bg-white
                            focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
              <button type="button" @click="searchMemberCandidates()"
                      class="px-3 py-1.5 text-sm rounded-full bg-gray-200 hover:bg-accent hover:text-white transition">Search</button>
            </div>
            <div x-show="memberResults.length > 0" class="space-y-1.5">
              <template x-for="u in memberResults" :key="u.userid">
                <div class="flex items-center gap-2 bg-white rounded-lg border border-gray-100 px-3 py-1.5">
                  <div class="flex-1 min-w-0">
                    <span class="text-sm text-gray-800" x-text="u.username"></span>
                    <span class="text-xs text-gray-400 ml-1" x-text="u.email"></span>
                  </div>
                  <button type="button" @click="addMember(t.teamid, u)"
                          class="text-xs font-semibold text-green-600 hover:text-green-800 transition shrink-0">Add</button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <div x-show="teams.length === 0" class="py-16 text-center text-gray-400 text-sm">No teams found.</div>
    </div>

    <!-- Pagination -->
    <div x-show="!loading && total > limit" class="flex items-center justify-between mt-4 text-sm text-gray-500">
      <button type="button" @click="prevPage()"
              :disabled="offset === 0"
              :class="offset === 0 ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">← Prev</button>
      <span x-text="(offset + 1) + '–' + Math.min(offset + limit, total) + ' of ' + total"></span>
      <button type="button" @click="nextPage()"
              :disabled="offset + limit >= total"
              :class="offset + limit >= total ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">Next →</button>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast.visible"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm
              px-5 py-2.5 rounded-xl shadow-lg whitespace-nowrap z-50"
       x-text="toast.message">
  </div>

</body>
</html>
