<!DOCTYPE html>
<html lang="en" x-data="wallApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoApp</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Compiled Tailwind CSS (generated by scripts/build-tailwind.sh) -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- App logic — registers alpine:init listener before alpinejs.min.js fires it. -->
  <script src="/app.js"></script>
  <!-- Alpine.js CSP build -->
  <script defer src="/alpinejs.min.js"></script>

  <link rel="stylesheet" href="/fonts.css">

  <style>
    :root {
      --brand:  #1a1a2e;
      --accent: #e94560;
      --surface:#f7f5f2;
      --card:   #ffffff;
      --muted:  #6b7280;
      --border: #e5e1db;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--brand); }
    h1,h2,h3 { font-family: 'DM Serif Display', serif; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    @keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(.95);      } to { opacity:1; transform:scale(1);      } }
    .animate-fadein  { animation: fadeIn  .25s ease both; }
    .animate-scalein { animation: scaleIn .2s  ease both; }

    .backdrop { background: rgba(26,26,46,.55); backdrop-filter: blur(3px); }

    [x-cloak] { display: none !important; }

    img.avatar { background-color: #e5e7eb; }

    /* Wall grid rows */
    .wall-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      width: 100%;
      overflow: hidden;
    }
    .wall-photo {
      display: block;
      min-width: 0;
      overflow: hidden;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }
    .wall-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .15s;
    }
    .wall-photo:hover img { opacity: .88; }
  </style>
</head>

<body class="min-h-screen flex flex-col">

{{template "regular-header" .}}

<!-- ══ UPLOAD PHOTOS MODAL ══════════════════════════════════════════════════ -->
<template x-if="$store.upload.open">
  <div class="fixed inset-0 z-50 flex items-center justify-center backdrop p-4"
       @click.self="$store.upload.open = false"
       @dragover.prevent
       @drop.prevent="$store.upload.addFiles($event.dataTransfer.files)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-scalein max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between mb-4 shrink-0">
        <h2 class="font-serif text-xl">Upload Photos</h2>
        <button @click="$store.upload.open = false" class="text-muted hover:text-brand text-2xl leading-none">&times;</button>
      </div>

      <div class="overflow-y-auto flex-1 -mx-1 px-1">
        <!-- Drop zone / file picker -->
        <label class="flex flex-col items-center justify-center gap-2 w-full border-2 border-dashed border-[var(--border)] rounded-2xl py-8 cursor-pointer hover:bg-gray-50 hover:border-accent/50 transition text-center mb-5">
          <svg class="w-8 h-8 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          <span class="text-sm font-medium">Drop photos here or click to browse</span>
          <span class="text-xs text-muted">JPEG, PNG, or GIF</span>
          <input type="file" accept="image/jpeg,image/png,image/gif" multiple class="hidden"
                 @change="$store.upload.addFiles($event.target.files) || ($event.target.value = '')" />
        </label>

        <!-- Batch labels -->
        <div class="mb-5">
          <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-2">Labels for this batch</p>
          <div class="flex flex-wrap gap-1.5 mb-2" x-show="$store.upload.labels.length">
            <template x-for="(l, idx) in $store.upload.labels" :key="l.name + ':' + l.value">
              <span class="inline-flex items-center gap-1.5 bg-gray-100 rounded-full pl-3 pr-1.5 py-1 text-xs">
                <span><span class="font-medium" x-text="l.name"></span>: <span x-text="l.value"></span></span>
                <button @click="$store.upload.removeLabel(idx)" class="text-muted hover:text-brand leading-none text-sm">&times;</button>
              </span>
            </template>
          </div>
          <div class="flex gap-2">
            <input x-model="$store.upload.newLabelName" @keydown.enter="$store.upload.addLabel()" type="text" placeholder="Name"
                   class="flex-1 min-w-0 border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent/30" />
            <input x-model="$store.upload.newLabelValue" @keydown.enter="$store.upload.addLabel()" type="text" placeholder="Value"
                   class="flex-1 min-w-0 border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent/30" />
            <button @click="$store.upload.addLabel()"
                    class="bg-gray-100 hover:bg-gray-200 text-brand text-xs font-medium px-3 py-1.5 rounded-lg transition shrink-0">Add</button>
          </div>
          <p class="text-xs text-muted mt-1.5">Applied to every photo in this batch, including ones already uploaded — add or remove labels any time.</p>
        </div>

        <!-- Upload queue -->
        <div x-show="$store.upload.queue.length" class="space-y-2">
          <div class="flex items-center justify-between">
            <p class="text-xs font-semibold text-muted uppercase tracking-widest">Queue</p>
            <button @click="$store.upload.clearFinished()"
                    x-show="$store.upload.queue.some(it => it.status === 'done')"
                    class="text-xs text-muted hover:text-brand underline underline-offset-2">Clear finished</button>
          </div>
          <template x-for="item in $store.upload.queue" :key="item.id">
            <div class="border border-[var(--border)] rounded-xl px-3 py-2">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-xs font-medium truncate" x-text="item.filename"></span>
                <div class="flex items-center gap-2 shrink-0">
                  <span x-show="item.status === 'done'" class="text-xs text-green-600 font-medium">Done</span>
                  <span x-show="item.status === 'error'" class="text-xs text-red-500 font-medium">Error</span>
                  <span x-show="item.status === 'uploading'" class="text-xs text-muted" x-text="item.progress + '%'"></span>
                  <span x-show="item.status === 'pending'" class="text-xs text-muted">Waiting…</span>
                  <button @click="$store.upload.retry(item)" x-show="item.status === 'error'"
                          class="text-xs text-accent hover:underline">Retry</button>
                  <button @click="$store.upload.removeItem(item.id)" x-show="item.status !== 'uploading'"
                          class="text-muted hover:text-brand leading-none text-sm">&times;</button>
                </div>
              </div>
              <div class="h-1.5 rounded-full bg-gray-100 overflow-hidden">
                <div class="h-full rounded-full transition-all"
                     :class="item.status === 'error' ? 'bg-red-400' : (item.status === 'done' ? 'bg-green-500' : 'bg-accent')"
                     :style="'width:' + (item.status === 'done' ? 100 : item.progress) + '%'"></div>
              </div>
              <p x-show="item.error" class="text-xs text-red-500 mt-1" x-text="item.error"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ══ MAIN ═════════════════════════════════════════════════════════════════ -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6" x-cloak>

  <!--
    x-ref="wall" must be on an element that is never display:none so that
    clientWidth is always readable for the layout algorithm.
    Nested x-show / x-if elements control visibility of the content inside.
  -->
  <div x-ref="wall" class="w-full">

    <!-- Initial loading spinner (before first batch) -->
    <div x-show="loading && rows.length === 0" class="flex items-center justify-center py-32">
      <div class="w-10 h-10 border-4 border-accent/30 border-t-accent rounded-full animate-spin"></div>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && rows.length === 0" class="text-center py-32">
      <p class="text-muted">No photos yet.</p>
    </div>

    <!-- Photo wall rows.
         While more photos are coming (hasMore), hide the last row so it
         doesn't jump when the next batch arrives and fills it out. -->
    <template x-for="(row, idx) in rows" :key="row.startIndex">
      <div class="wall-row" :style="'height:' + row.height + 'px'"
           x-show="!hasMore || idx < rows.length - 1">
        <template x-for="p in row.photos" :key="p.photoid">
          <a :href="'/photo.html?photoid=' + p.photoid"
             target="_blank"
             class="wall-photo"
             :style="row.stretch ? ('flex:' + p.flexGrow + ' 1 0px') : ('flex:0 0 ' + p.widthPx + 'px')">
            <img :src="thumbUrl(p.imageurl, p.displayWidth)"
                 :width="p.displayWidth"
                 :height="p.displayHeight"
                 :alt="p.photoid"
                 loading="lazy" />
          </a>
        </template>
      </div>
    </template>

    <!-- Load-more spinner -->
    <div x-show="loading && rows.length > 0" class="flex justify-center py-8">
      <div class="w-8 h-8 border-4 border-accent/30 border-t-accent rounded-full animate-spin"></div>
    </div>

    <!-- End-of-collection message -->
    <div x-show="!hasMore && rows.length > 0 && !loading" class="text-center py-8 text-xs text-muted">
      All photos loaded.
    </div>

  </div>

  <!-- Infinite-scroll sentinel — outside the wall div so it stays in the flow -->
  <div x-ref="sentinel" class="h-1 mt-2"></div>

</main>

<!-- ══ FOOTER ════════════════════════════════════════════════════════════════ -->
<footer class="mt-8 border-t border-[var(--border)] bg-white">
  <div class="max-w-7xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3 text-xs text-muted">
    <span>© 2024 Phōtos. All rights reserved.</span>
    <div class="flex gap-4">
      <a href="#" @click.prevent="showToast('Terms of Service not yet available.')"
         class="hover:text-brand underline underline-offset-2">Terms of Service</a>
      <a href="#" @click.prevent="showToast('Privacy Policy not yet available.')"
         class="hover:text-brand underline underline-offset-2">Privacy Policy</a>
    </div>
  </div>
</footer>

<!-- ══ TOAST ════════════════════════════════════════════════════════════════ -->
<div x-show="toast.visible" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-brand text-white text-sm px-5 py-3 rounded-2xl shadow-xl"
     x-text="toast.message">
</div>

</body>
</html>
