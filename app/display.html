<!DOCTYPE html>
<html lang="en" x-data="displayApp" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Display — PhotoApp</title>

  <link rel="stylesheet" href="/tailwind.css">
  <script src="/app.js"></script>
  <script defer src="/alpinejs.min.js"></script>
  <link rel="stylesheet" href="/fonts.css">

  <style>
    :root {
      --brand:  #1a1a2e;
      --accent: #e94560;
      --surface:#f7f5f2;
      --card:   #ffffff;
      --muted:  #6b7280;
      --border: #e5e1db;
      /* Museum board palette */
      --board-bg:     #f0ead6;
      --board-border: #d6ccb0;
      --frame-bg:     #e8e3d5;
      --placard-bg:   #faf7f0;
      --placard-border: #d6ccb0;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--brand); }
    h1,h2,h3,h4 { font-family: 'DM Serif Display', serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(.95);      } to { opacity:1; transform:scale(1);      } }
    .animate-fadein  { animation: fadeIn  .3s ease both; }
    .animate-scalein { animation: scaleIn .2s  ease both; }
    [x-cloak] { display: none !important; }

    /* Museum board */
    .board {
      background: var(--board-bg);
      border: 1px solid var(--board-border);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.08);
    }

    /* Photo slot */
    .slot-card {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .photo-frame {
      background: var(--frame-bg);
      border: 1px solid var(--board-border);
      border-radius: 4px 4px 0 0;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .photo-frame.empty-frame {
      color: #c5bfad;
      font-size: 0.75rem;
    }
    .slot-placard {
      background: var(--placard-bg);
      border: 1px solid var(--placard-border);
      border-top: none;
      border-radius: 0 0 4px 4px;
      padding: 0.5rem 0.625rem;
      min-height: 2.5rem;
      font-family: 'DM Serif Display', serif;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #3d3424;
    }

    /* Display grid */
    .display-grid {
      display: grid;
      gap: 1.25rem;
    }

    /* Edge-hover prev/next navigation — tall narrow arrows that only
       appear when the cursor is near the left/right edge of the screen. */
    .edge-nav {
      position: fixed;
      top: 56px; /* below the sticky navbar */
      bottom: 0;
      width: 7vw;
      min-width: 56px;
      max-width: 140px;
      display: flex;
      align-items: center;
      z-index: 30;
      text-decoration: none;
      cursor: pointer;
    }
    .edge-nav-left  { left: 0;  justify-content: flex-start; }
    .edge-nav-right { right: 0; justify-content: flex-end; }
    .edge-nav-disabled { pointer-events: none; }

    .edge-arrow {
      width: 2.75rem;
      height: 9rem;
      margin: 0 0.5rem;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
      opacity: 0;
      transform: scale(.92);
      transition: opacity .18s ease, transform .18s ease;
    }
    .edge-nav:hover .edge-arrow { opacity: 1; transform: scale(1); }
    .edge-nav-disabled .edge-arrow { opacity: 0 !important; }
    .edge-arrow svg { width: 1.5rem; height: 1.5rem; }
  </style>
</head>

<body class="min-h-screen flex flex-col">

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="sticky top-0 z-40 bg-white border-b border-[var(--border)] shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center gap-3 h-14">

    <!-- Hamburger -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" class="p-2 rounded-lg hover:bg-gray-100 transition" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div x-show="open" @click.outside="open=false" x-transition
           class="absolute left-0 top-10 bg-white border border-[var(--border)] rounded-xl shadow-lg w-52 py-1 animate-scalein">
        <a href="/" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Photos</a>

        <div x-data="galleriesNav">
          <span x-show="!loaded" class="block px-4 py-2.5 text-sm text-gray-300 cursor-default">Galleries</span>
          <span x-show="loaded && galleries.length === 0"
                class="block px-4 py-2.5 text-sm text-gray-300 cursor-default">Galleries</span>
          <a x-show="loaded && galleries.length > 0"
             :href="galleriesHref"
             class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Galleries</a>
          <div x-show="loaded && galleries.length > 1">
            <template x-for="g in galleries" :key="g.galleryid">
              <a :href="'/galleries.html?galleryid=' + g.galleryid"
                 class="block pl-7 pr-4 py-1.5 text-xs text-[var(--muted)] hover:text-[var(--brand)] hover:bg-gray-50 truncate">
                <span x-text="g.title"></span>
              </a>
            </template>
          </div>
        </div>

        <a href="/gallery-admin.html" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Gallery Admin</a>
        <a href="/template-admin.html" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Template Admin</a>
      </div>
    </div>

    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[var(--brand)] flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <span class="font-serif text-lg font-bold text-[var(--brand)] hidden sm:block">Phōtos</span>
    </a>
  </div>
</nav>

<!-- ══ MAIN ══════════════════════════════════════════════════════════════════ -->
<main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">

  <!-- Loading -->
  <div x-show="loading" class="flex flex-col items-center justify-center py-32 gap-4">
    <svg class="w-8 h-8 text-[var(--accent)] animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>
    <p class="text-[var(--muted)] text-sm">Loading display…</p>
  </div>

  <!-- Error -->
  <div x-show="!loading && error" class="text-center py-32">
    <p class="text-[var(--muted)]" x-text="error"></p>
    <a href="/galleries.html" class="mt-4 inline-block text-sm text-[var(--accent)] hover:underline">Back to Galleries</a>
  </div>

  <!-- Museum exhibit board — photos and placards only -->
  <div x-show="!loading && !error && display" class="animate-fadein">
    <div class="board">

      <!-- Empty display (no slots) -->
      <div x-show="display && display.slots && display.slots.length === 0"
           class="py-16 text-center text-[var(--muted)] text-sm">
        This display has no photo slots yet.
      </div>

      <!-- Photo slots grid -->
      <div x-show="display && display.slots && display.slots.length > 0"
           class="display-grid"
           :style="gridStyle">
        <template x-for="slot in (display && display.slots || [])" :key="slot.slotid">
          <div class="slot-card">
            <!-- Photo -->
            <template x-if="slot.photo">
              <div class="photo-frame">
                <img :src="thumbUrl(slot.photo.imageurl, 600)"
                     :alt="'Slot ' + slot.slot_index"
                     loading="lazy" />
              </div>
            </template>
            <!-- Empty slot placeholder -->
            <template x-if="!slot.photo">
              <div class="photo-frame empty-frame">
                <span>Empty</span>
              </div>
            </template>
            <!-- Placard -->
            <div class="slot-placard">
              <span x-show="slot.rich_text" x-text="slot.rich_text"></span>
              <span x-show="!slot.rich_text" class="opacity-40 text-xs italic">No caption</span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</main>

<!-- ══ EDGE-HOVER PREV / NEXT ═════════════════════════════════════════════ -->
<a class="edge-nav edge-nav-left"
   x-show="!loading && !error && display"
   :class="{ 'edge-nav-disabled': !prevDisplayId }"
   @click.prevent="goToPrev()" href="#" aria-label="Previous display">
  <span class="edge-arrow">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
  </span>
</a>
<a class="edge-nav edge-nav-right"
   x-show="!loading && !error && display"
   :class="{ 'edge-nav-disabled': !nextDisplayId }"
   @click.prevent="goToNext()" href="#" aria-label="Next display">
  <span class="edge-arrow">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
  </span>
</a>

</body>
</html>
