<!DOCTYPE html>
<html lang="en" x-data="displayEditApp" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Display — PhotoApp</title>

  <link rel="stylesheet" href="/tailwind.css">
  <script src="/app.js"></script>
  <script defer src="/alpinejs.min.js"></script>
  <link rel="stylesheet" href="/fonts.css">

  <style>
    :root {
      --brand:  #1a1a2e;
      --accent: #e94560;
      --surface:#f7f5f2;
      --card:   #ffffff;
      --muted:  #6b7280;
      --border: #e5e1db;
      /* Museum board palette */
      --board-bg:     #f0ead6;
      --board-border: #d6ccb0;
      --frame-bg:     #e8e3d5;
      --placard-bg:   #faf7f0;
      --placard-border: #d6ccb0;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--brand); }
    h1,h2,h3,h4 { font-family: 'DM Serif Display', serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(.95);      } to { opacity:1; transform:scale(1);      } }
    .animate-fadein  { animation: fadeIn  .3s ease both; }
    .animate-scalein { animation: scaleIn .2s  ease both; }
    [x-cloak] { display: none !important; }
    .backdrop { background: rgba(26,26,46,.55); backdrop-filter: blur(3px); }

    /* Board — plain layout wrapper. Framing now comes entirely from each
       photo's own matte/frame (presentation.matte / presentation.frame),
       so this no longer has its own decorative background or border. */
    .board {
      padding: 0;
    }

    /* Photo slot — positioned absolutely within .display-grid per the
       template's slot_positions (left/top/width/height set inline via
       slotBoxStyle(), in percent — same geometry the Template Admin preview
       pane renders). */
    .slot-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-sizing: border-box;
      background: var(--surface);
    }
    /* .photo-area is the flexible region the slot gives to the photo
       (everything except the placard). The framed photo NEVER stretches to
       fill it — it keeps its own aspect ratio (see .photo-frame) and is
       aligned within .photo-area per presentation.align (photoAreaStyle()).
       Any leftover space is just .photo-area's own background showing
       through — the page background, not a fill of its own. */
    .photo-area {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }
    /* .photo-frame is the outer frame border (style set inline from the
       template's presentation.frame); .photo-matte is the mat board inside
       it (padding + color set inline from presentation.matte). Both are
       independently optional — see frameOuterStyle()/matteInnerStyle().
       The frame's own size comes from the photo's aspect ratio
       (photoFrameSizeStyle()), capped to fit inside .photo-area — it is
       never stretched to the slot's shape. position:relative anchors the
       edit button to the photo's own corner. */
    .photo-frame {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
    }
    .photo-matte {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
    }
    .photo-matte img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .photo-matte.empty-matte {
      color: #c5bfad;
      font-size: 0.75rem;
    }
    .slot-edit-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(26,26,46,.75);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.55rem;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .slot-edit-btn:hover { background: rgba(26,26,46,.92); }

    /* Photo picker modal */
    .picker-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      width: 100%;
      max-width: 30rem;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
    }
    .picker-results {
      overflow-y: auto;
      flex: 1;
    }
    .picker-result {
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .picker-thumb {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .picker-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .15s;
    }
    .picker-result:hover .picker-thumb img { opacity: .8; }
    /* Base placard styling is a fallback for fields with no typography of
       their own; presentation.placard.fields[].typography overrides per line. */
    .slot-placard {
      background: var(--placard-bg);
      border: 1px solid var(--placard-border);
      border-radius: 4px;
      padding: 0.5rem 0.625rem;
      min-height: 2.5rem;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
      font-family: 'DM Serif Display', serif;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #3d3424;
    }

    /* Display grid — a fixed-aspect canvas that each slot is positioned
       within by percentage (see .slot-card / slotBoxStyle()), matching the
       Template Admin preview pane exactly. */
    .display-grid {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    /* Nav arrow buttons */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1rem;
      background: var(--brand);
      color: #fff;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
      text-decoration: none;
    }
    .nav-btn:hover { opacity: .85; }
    .nav-btn:disabled, .nav-btn[disabled] { opacity: .35; cursor: default; pointer-events: none; }
    .nav-btn-ghost {
      background: none;
      color: var(--brand);
      border: 1px solid var(--border);
    }
    .nav-btn-ghost:hover { opacity: 1; background: var(--surface); }

    .edit-banner {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      border-radius: 8px;
      padding: 0.5rem 0.875rem;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="sticky top-0 z-40 bg-white border-b border-[var(--border)] shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center gap-3 h-14">

    <!-- Hamburger -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" class="p-2 rounded-lg hover:bg-gray-100 transition" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div x-show="open" @click.outside="open=false" x-transition
           class="absolute left-0 top-10 bg-white border border-[var(--border)] rounded-xl shadow-lg w-52 py-1 animate-scalein">
        <a href="/" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Photos</a>

        <div x-data="galleriesNav">
          <span x-show="!loaded" class="block px-4 py-2.5 text-sm text-gray-300 cursor-default">Galleries</span>
          <span x-show="loaded && galleries.length === 0"
                class="block px-4 py-2.5 text-sm text-gray-300 cursor-default">Galleries</span>
          <a x-show="loaded && galleries.length > 0"
             :href="galleriesHref"
             class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Galleries</a>
          <div x-show="loaded && galleries.length > 1">
            <template x-for="g in galleries" :key="g.galleryid">
              <a :href="'/galleries.html?galleryid=' + g.galleryid"
                 class="block pl-7 pr-4 py-1.5 text-xs text-[var(--muted)] hover:text-[var(--brand)] hover:bg-gray-50 truncate">
                <span x-text="g.title"></span>
              </a>
            </template>
          </div>
        </div>

        <a href="/gallery-admin.html" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Gallery Admin</a>
        <a href="/template-admin.html" class="block px-4 py-2.5 text-sm hover:bg-gray-50 font-medium">Template Admin</a>
      </div>
    </div>

    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[var(--brand)] flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <span class="font-serif text-lg font-bold text-[var(--brand)] hidden sm:block">Phōtos</span>
    </a>

    <!-- Breadcrumb: Gallery → display position -->
    <div x-show="gallery && !loading" class="ml-4 flex items-center gap-2 text-sm text-[var(--muted)] min-w-0">
      <a href="/galleries.html" class="hover:text-[var(--brand)] transition shrink-0">Galleries</a>
      <span class="shrink-0">›</span>
      <a :href="'/galleries.html?galleryid=' + (gallery && gallery.galleryid)"
         class="hover:text-[var(--brand)] transition truncate max-w-[160px]"
         x-text="gallery && gallery.title"></a>
      <span class="shrink-0">›</span>
      <span class="shrink-0" x-text="'Display ' + (currentIndex + 1) + ' of ' + galleryDisplays.length"></span>
    </div>

    <div class="ml-auto shrink-0">
      <span class="edit-banner">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        Editing
      </span>
    </div>
  </div>
</nav>

<!-- ══ MAIN ══════════════════════════════════════════════════════════════════ -->
<main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">

  <!-- Loading -->
  <div x-show="loading" class="flex flex-col items-center justify-center py-32 gap-4">
    <svg class="w-8 h-8 text-[var(--accent)] animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>
    <p class="text-[var(--muted)] text-sm">Loading display…</p>
  </div>

  <!-- Error -->
  <div x-show="!loading && error" class="text-center py-32">
    <p class="text-[var(--muted)]" x-text="error"></p>
    <a href="/galleries.html" class="mt-4 inline-block text-sm text-[var(--accent)] hover:underline">Back to Galleries</a>
  </div>

  <!-- Museum exhibit board -->
  <div x-show="!loading && !error && display" class="animate-fadein">

    <!-- Board header -->
    <div class="mb-6 flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-serif" x-text="gallery && gallery.title"></h1>
        <p class="text-sm text-[var(--muted)] mt-0.5"
           x-text="'Display ' + (currentIndex + 1) + ' of ' + galleryDisplays.length"></p>
      </div>
      <!-- Navigation at top -->
      <div class="flex items-center gap-2">
        <a class="nav-btn nav-btn-ghost" :href="'/display.html?displayid=' + (display && display.displayid)">
          View live
        </a>
        <button class="nav-btn" @click="goToPrev()" :disabled="!prevDisplayId">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          Prev
        </button>
        <button class="nav-btn" @click="goToNext()" :disabled="!nextDisplayId">
          Next
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- The board itself -->
    <div class="board">

      <!-- Empty display (no slots) -->
      <div x-show="display && display.slots && display.slots.length === 0"
           class="py-16 text-center text-[var(--muted)] text-sm">
        This display has no photo slots yet. Add a template in Gallery Admin.
      </div>

      <!-- Photo slots grid — each slot absolutely positioned per the
           template's slot_positions (slotBoxStyle), matching the Template
           Admin preview pane. -->
      <div x-show="display && display.slots && display.slots.length > 0"
           class="display-grid" x-ref="grid">
        <template x-for="(slot, i) in (display && display.slots || [])" :key="slot.slotid">
          <div class="slot-card" :style="slotBoxStyle(i) + slotCardDirectionStyle()">
            <!-- Photo area — the framed photo keeps its own aspect ratio and
                 is aligned within any leftover space per presentation.align;
                 that leftover space is always just background, never a frame
                 that's been stretched out of shape. Frame size (width/height)
                 is measured in JS (layoutFrames()) so the matte/frame widths
                 stay exactly uniform on every side — see computeFrameBoxSize
                 comment in app.js. -->
            <div class="photo-area" :style="photoAreaStyle()">
              <div class="photo-frame" :style="frameOuterStyle() + photoFrameSizeStyle(i, slot)">
                <template x-if="slot.photo">
                  <div class="photo-matte" :style="matteInnerStyle()">
                    <img :src="thumbUrl(slot.photo.imageurl, 600)"
                         :alt="'Slot ' + slot.slot_index"
                         loading="lazy" />
                  </div>
                </template>
                <!-- Empty slot placeholder -->
                <template x-if="!slot.photo">
                  <div class="photo-matte empty-matte" :style="matteInnerStyle()">
                    <span>Empty</span>
                  </div>
                </template>
                <button x-show="loggedInUser" class="slot-edit-btn" @click="openPicker(slot.slot_index)"
                        x-text="slot.photo ? 'Change photo' : 'Add photo'"></button>
              </div>
            </div>
            <!-- Placard — fields + typography come from presentation.placard -->
            <div class="slot-placard" :style="placardBoxStyle()">
              <template x-for="(f, i) in placardFieldsFor(slot)" :key="i">
                <div :style="f.style" x-text="f.text"></div>
              </template>
              <span x-show="placardFieldsFor(slot).length === 0" class="opacity-40 text-xs italic">No caption</span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Navigation at bottom -->
    <div class="mt-6 flex justify-between items-center">
      <button class="nav-btn" @click="goToPrev()" :disabled="!prevDisplayId">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Previous Display
      </button>
      <a href="/galleries.html" class="text-sm text-[var(--muted)] hover:text-[var(--brand)] transition">
        All Galleries
      </a>
      <button class="nav-btn" @click="goToNext()" :disabled="!nextDisplayId">
        Next Display
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

  </div>
</main>

<!-- ══ PHOTO PICKER ════════════════════════════════════════════════════════ -->
<div x-show="pickerOpen" x-cloak x-transition
     class="fixed inset-0 z-50 flex items-center justify-center backdrop p-4"
     @click.self="closePicker()"
     @keydown.escape.window="closePicker()">
  <div class="picker-card animate-scalein">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-serif text-lg">Choose a photo</h3>
      <button class="text-[var(--muted)] hover:text-[var(--brand)] text-xl leading-none px-1" @click="closePicker()">&times;</button>
    </div>

    <input class="input w-full mb-3"
           style="border:1px solid var(--border); border-radius:7px; padding:0.5rem 0.75rem; font-size:0.875rem;"
           type="text"
           placeholder="Search photos by title, label, @user…"
           x-model="pickerQuery"
           @input="onPickerInput()" />

    <div class="picker-results">
      <div x-show="pickerLoading" class="text-sm text-[var(--muted)] text-center py-8">Searching…</div>

      <div x-show="!pickerLoading && pickerError" class="text-sm text-red-500 text-center py-8" x-text="pickerError"></div>

      <div x-show="!pickerLoading && !pickerError && pickerQuery.trim() && pickerResults.length === 0"
           class="text-sm text-[var(--muted)] text-center py-8">
        No photos found.
      </div>

      <div x-show="!pickerLoading && !pickerQuery.trim()" class="text-sm text-[var(--muted)] text-center py-8">
        Type to search photos.
      </div>

      <div x-show="!pickerLoading && pickerResults.length > 0" class="grid grid-cols-3 gap-2">
        <template x-for="p in pickerResults" :key="p.photoid">
          <button class="picker-result" @click="selectPickerPhoto(p)" :disabled="pickerSaving">
            <div class="picker-thumb">
              <img :src="thumbUrl(p.imageurl, 200)" :alt="p.title || 'Untitled photo'" loading="lazy" />
            </div>
            <p class="text-xs mt-1 truncate" x-text="p.title || '(untitled)'"></p>
          </button>
        </template>
      </div>
    </div>

    <button x-show="currentPickerSlot() && currentPickerSlot().photo"
            class="btn-secondary text-sm mt-3 self-start"
            style="border:1px solid var(--border); border-radius:7px; padding:0.5rem 1rem; background:none; cursor:pointer;"
            :disabled="pickerSaving"
            @click="clearPickerPhoto()">
      Remove photo from this slot
    </button>
  </div>
</div>

<!-- ══ TOAST ═══════════════════════════════════════════════════════════════ -->
<div x-show="toast.visible" x-transition
     class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[var(--brand)] text-white text-sm px-5 py-2.5 rounded-full shadow-lg pointer-events-none"
     x-text="toast.message">
</div>

</body>
</html>
