<!DOCTYPE html>
<html lang="en" x-data="adminLabels" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label Admin</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/fonts.css">
  <script src="/admin.js"></script>
  <script defer src="/alpinejs.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-[#1a1a2e] text-white px-5 py-3.5 flex items-center justify-between gap-4">
    <h1 class="text-lg font-bold tracking-tight shrink-0">Label Admin</h1>
    <div class="flex items-center gap-5 shrink-0">
      <span class="text-xs text-white/60" x-text="total + ' label names'"></span>
      <a href="/" class="text-xs text-white/60 hover:text-white transition">← Back to app</a>
    </div>
  </header>

  <!-- Admin page nav -->
  <nav class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center gap-1 text-sm overflow-x-auto">
    <a href="/admin-master.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Overview</a>
    <a href="/admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Photos</a>
    <a href="/admin-users.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Users</a>
    <a href="/admin-teams.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Teams</a>
    <a href="/admin-emojis.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Emojis</a>
    <a href="/admin-labels.html" class="px-3 py-1.5 rounded-lg font-semibold bg-gray-100 whitespace-nowrap">Labels</a>
    <a href="/admin-permissions.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Permissions</a>
    <a href="/admin-roles.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Roles</a>
    <a href="/gallery-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Galleries</a>
    <a href="/template-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Templates</a>
  </nav>

  <!-- Auth error -->
  <div x-show="authError"
       class="max-w-md mx-auto mt-12 bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-800 text-sm">
    You don't have admin access, or the server needs to be rebuilt with the latest code.
  </div>

  <div x-show="!authError" class="max-w-4xl mx-auto p-4">
    <!-- Search + filter -->
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      <input type="search" x-model="search" placeholder="Search label names…"
             @keyup.enter="doSearch()"
             class="flex-1 max-w-sm px-3 py-1.5 text-sm border border-gray-300 rounded-full bg-white
                    focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
      <button type="button" @click="doSearch()"
              class="px-3 py-1.5 text-sm rounded-full bg-gray-200 hover:bg-accent hover:text-white transition">Search</button>
      <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none ml-auto">
        <input type="checkbox" x-model="includeDisabled" @change="doSearch()"
               class="w-4 h-4 accent-[#e94560] cursor-pointer" />
        Show disabled
      </label>
    </div>

    <!-- Loading skeleton -->
    <div x-show="loading" class="space-y-2">
      <template x-for="n in [1,2,3,4,5]" :key="n">
        <div class="h-12 bg-white rounded-xl border border-gray-200 animate-pulse"></div>
      </template>
    </div>

    <!-- Label name list -->
    <div x-show="!loading" class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-100 text-left text-xs text-gray-500 uppercase tracking-wide">
            <th class="px-4 py-2.5 font-semibold">Name</th>
            <th class="px-3 py-2.5 font-semibold text-center">Uses</th>
            <th class="px-3 py-2.5 font-semibold text-center">Color</th>
            <th class="px-3 py-2.5 font-semibold text-center">Restricted</th>
            <th class="px-3 py-2.5 font-semibold text-center">Enabled</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="n in names" :key="n.name">
            <tr class="border-b border-gray-50 last:border-0" :class="!n.enabled ? 'bg-red-50/40' : ''">
              <td class="px-4 py-3 font-medium text-gray-800" x-text="n.name"></td>
              <td class="px-3 py-3 text-center text-gray-500" x-text="n.usage_count"></td>
              <td class="px-3 py-3 text-center">
                <div class="flex items-center justify-center gap-2">
                  <input type="color" :value="n.color || '#94a3b8'"
                         @change="setColor(n, $event.target.value)"
                         class="w-7 h-7 rounded cursor-pointer border border-gray-200" />
                  <button type="button" x-show="n.color" @click="setColor(n, '')"
                          class="text-[11px] text-gray-400 hover:text-accent" title="Clear override">reset</button>
                </div>
              </td>
              <td class="px-3 py-3 text-center">
                <input type="checkbox" x-model="n.restricted" @change="toggleRestricted(n)"
                       class="w-4 h-4 accent-[#e94560] cursor-pointer" />
              </td>
              <td class="px-3 py-3 text-center">
                <input type="checkbox" x-model="n.enabled" @change="toggleEnabled(n)"
                       class="w-4 h-4 accent-[#e94560] cursor-pointer" />
              </td>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- Empty state -->
      <div x-show="names.length === 0" class="py-16 text-center text-gray-400 text-sm">No label names found.</div>
    </div>

    <!-- Pagination -->
    <div x-show="!loading && total > limit" class="flex items-center justify-between mt-4 text-sm text-gray-500">
      <button type="button" @click="prevPage()"
              :disabled="offset === 0"
              :class="offset === 0 ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">← Prev</button>
      <span x-text="(offset + 1) + '–' + Math.min(offset + limit, total) + ' of ' + total"></span>
      <button type="button" @click="nextPage()"
              :disabled="offset + limit >= total"
              :class="offset + limit >= total ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">Next →</button>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast.visible"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm
              px-5 py-2.5 rounded-xl shadow-lg whitespace-nowrap z-50"
       x-text="toast.message">
  </div>

</body>
</html>
