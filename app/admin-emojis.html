<!DOCTYPE html>
<html lang="en" x-data="adminEmojis" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Admin</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/fonts.css">
  <script src="/admin.js"></script>
  <script defer src="/alpinejs.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-[#1a1a2e] text-white px-5 py-3.5 flex items-center justify-between gap-4">
    <h1 class="text-lg font-bold tracking-tight shrink-0">Emoji Admin</h1>
    <div class="flex items-center gap-5 shrink-0">
      <span class="text-xs text-white/60" x-text="total + ' emoji types'"></span>
      <a href="/" class="text-xs text-white/60 hover:text-white transition">← Back to app</a>
    </div>
  </header>

  <!-- Admin page nav -->
  <nav class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center gap-1 text-sm overflow-x-auto">
    <a href="/admin-master.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Overview</a>
    <a href="/admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Photos</a>
    <a href="/admin-users.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Users</a>
    <a href="/admin-emojis.html" class="px-3 py-1.5 rounded-lg font-semibold bg-gray-100 whitespace-nowrap">Emojis</a>
    <a href="/admin-labels.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Labels</a>
    <a href="/gallery-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Galleries</a>
    <a href="/template-admin.html" class="px-3 py-1.5 rounded-lg hover:bg-gray-50 whitespace-nowrap">Templates</a>
  </nav>

  <!-- Auth error -->
  <div x-show="authError"
       class="max-w-md mx-auto mt-12 bg-red-50 border border-red-300 rounded-2xl p-6 text-center text-red-800 text-sm">
    You don't have admin access, or the server needs to be rebuilt with the latest code.
  </div>

  <div x-show="!authError" class="max-w-4xl mx-auto p-4">
    <!-- Search + filter -->
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      <input type="search" x-model="search" placeholder="Search alt text…"
             @keyup.enter="doSearch()"
             class="flex-1 max-w-sm px-3 py-1.5 text-sm border border-gray-300 rounded-full bg-white
                    focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent/60 transition" />
      <button type="button" @click="doSearch()"
              class="px-3 py-1.5 text-sm rounded-full bg-gray-200 hover:bg-accent hover:text-white transition">Search</button>
      <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none ml-auto">
        <input type="checkbox" x-model="includeDisabled" @change="doSearch()"
               class="w-4 h-4 accent-[#e94560] cursor-pointer" />
        Show disabled
      </label>
    </div>

    <!-- Loading skeleton -->
    <div x-show="loading" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3">
      <template x-for="n in [1,2,3,4,5,6,7,8]" :key="n">
        <div class="h-20 bg-white rounded-xl border border-gray-200 animate-pulse"></div>
      </template>
    </div>

    <!-- Emoji grid -->
    <div x-show="!loading" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3">
      <template x-for="em in emojis" :key="em.emojiid">
        <div class="bg-white rounded-xl border shadow-sm p-3 flex flex-col items-center gap-1.5 text-center"
             :class="em.is_active ? 'border-gray-200' : 'border-red-300 bg-red-50/40 opacity-70'">
          <span x-show="em.emoji" x-text="em.emoji" class="text-2xl leading-none"></span>
          <img x-show="!em.emoji && em.imageurl" :src="thumbUrl(em.imageurl, 40)" :alt="em.alttext"
               class="w-8 h-8 object-contain" />
          <span class="text-xs text-gray-600 truncate w-full" x-text="em.alttext"></span>
          <span class="text-[10px] text-gray-400" x-text="em.usage_count + ' uses'"></span>
          <label class="flex items-center gap-1 cursor-pointer select-none mt-0.5">
            <input type="checkbox" x-model="em.is_active" @change="toggleActive(em)"
                   class="w-3.5 h-3.5 accent-[#e94560] cursor-pointer" />
            <span class="text-xs font-semibold" :class="em.is_active ? 'text-green-600' : 'text-gray-400'"
                  x-text="em.is_active ? 'Enabled' : 'Disabled'"></span>
          </label>
        </div>
      </template>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && emojis.length === 0" class="py-16 text-center text-gray-400 text-sm">No emoji types found.</div>

    <!-- Pagination -->
    <div x-show="!loading && total > limit" class="flex items-center justify-between mt-4 text-sm text-gray-500">
      <button type="button" @click="prevPage()"
              :disabled="offset === 0"
              :class="offset === 0 ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">← Prev</button>
      <span x-text="(offset + 1) + '–' + Math.min(offset + limit, total) + ' of ' + total"></span>
      <button type="button" @click="nextPage()"
              :disabled="offset + limit >= total"
              :class="offset + limit >= total ? 'opacity-30 cursor-default' : 'hover:text-accent cursor-pointer'">Next →</button>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast.visible"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm
              px-5 py-2.5 rounded-xl shadow-lg whitespace-nowrap z-50"
       x-text="toast.message">
  </div>

</body>
</html>
